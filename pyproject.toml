[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-health-analyzer"
version = "0.2.0"
description = "A private, local-first, open-source analyzer for Apple Health exports."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Thijs Nannings" }]
keywords = ["apple-health", "healthkit", "health-data", "duckdb", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "duckdb>=0.10.0",
  "fastapi>=0.115,<1.0",
  "pandas>=2.1",
  "platformdirs>=4.2,<5.0",
  "pydantic>=2.8,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
apple-health = "apple_health_dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["apple_health_dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
